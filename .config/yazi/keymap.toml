[[mgr.prepend_keymap]]
on = [ "g", "D"]
run = "cd ~/Documents"
desc = "Go to Documents"

[[mgr.prepend_keymap]]
on = [ "g", "W" ]
run = "cd ~/.local/share/WeChat_Data/xwechat_files/wxid_t51kt7hxrahv22_1bcd/msg/file/"
desc = "Go to Wechat files"

[[mgr.prepend_keymap]]
on = [ "g", "L" ]
run = "cd ~/.local"
desc = "Go to .local"

[[mgr.prepend_keymap]]
desc = "Press a key for bunny to save or go-to directory"
on = "B"
run = "plugin bunny"

# Optionally, add another keymap to immediately fuzzy search bookmarks
[[mgr.prepend_keymap]]
desc = "Start bunny.yazi fuzzy search"
on = "'"
run = "plugin bunny fuzzy"
